# Render Blueprint Specification for VaultBridge Proof Pipeline API
services:
  - type: web
    name: vaultbridge-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: proof-pipeline
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SEPOLIA_RPC_URL
        value: https://eth-sepolia.g.alchemy.com/v2/demo
      - key: CREDITCOIN_RPC_URL
        value: https://rpc.cc3-testnet.creditcoin.network
      - key: CREDITCOIN_PROOF_BUILDER_URL
        value: https://prover.cc3-testnet.creditcoin.network
      - key: INVOICE_REGISTRAR_ADDRESS
        value: 0x7B88F2D4435BB909196F9e54c8bD0Cc02b36b021
      - key: STREAK_REGISTRY_ADDRESS
        value: 0x870a9D0207A2c72A292386848b33B3F4aBA8E9ce
      - key: VAULT_LENDING_ADDRESS
        value: 0xE8686e4D2856Da637F2c17c71d818911Ec541dE5
      - key: ACCESS_REGISTRY_ADDRESS
        value: 0xACCcD369182aE9d45dbc9E8d75Bf6CA7814A3CEe
      - key: STREAK_VERIFIER_ADDRESS
        value: 0xA8254Fb11692A5Db4c4925AaBC6aFc535E22542A
      - key: STREAK_BADGE_ADDRESS
        value: 0xfa41181596515986C87A969F51daD5af597eB3b7
      - key: MOCK_ERC20_ADDRESS
        value: 0x5a892509a0eeEe4fA12aFDC1D3d9B59C11efA714
      - key: PRIVATE_KEY
        sync: false
